<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 08 — Alert / Notification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-white p-4 font-sans antialiased sm:p-8">
  <main class="w-full max-w-[720px] min-h-[520px] rounded-[32px] border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
    <header class="border-b border-slate-200 pb-5">
      <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold tracking-wide text-blue-600">EXERCISE 08</span>
      <h1 class="mt-5 text-[26px] font-extrabold tracking-tight text-slate-900">Alert / Notification</h1>
      <p class="mt-2 text-sm text-slate-500">Semantic variants + icon/title/message/actions</p>
    </header>

    <section class="mt-9 flex w-fit flex-col items-start gap-3.5 rounded-3xl bg-slate-100 p-5">
      <!-- Success -->
      <div role="status" class="flex items-start gap-3 rounded-2xl bg-green-50 px-4 py-3.5">
        <svg class="mt-0.5 h-5 w-5 shrink-0 text-green-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <div>
          <p class="text-base font-bold text-slate-900">Success</p>
          <p class="text-sm text-slate-500">Your changes were saved.</p>
        </div>
      </div>

      <!-- Warning -->
      <div role="status" class="flex items-start gap-3 rounded-2xl bg-amber-50 px-4 py-3.5">
        <svg class="mt-0.5 h-5 w-5 shrink-0 text-amber-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M8.26 2.9a2 2 0 013.48 0l6.02 10.7A2 2 0 0116.02 16.6H3.98a2 2 0 01-1.74-2.98L8.26 2.9zM10 6a1 1 0 00-1 1v3a1 1 0 102 0V7a1 1 0 00-1-1zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
        </svg>
        <div>
          <p class="text-base font-bold text-slate-900">Warning</p>
          <p class="text-sm text-slate-500">Review the required fields.</p>
        </div>
      </div>

      <!-- Error -->
      <div role="alert" class="flex items-start gap-3 rounded-2xl bg-red-50 px-4 py-3.5">
        <svg class="mt-0.5 h-5 w-5 shrink-0 text-red-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM10 5a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
        </svg>
        <div>
          <p class="text-base font-bold text-slate-900">Error</p>
          <p class="text-sm text-slate-500">Something went wrong.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
