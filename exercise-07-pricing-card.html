<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 07 — Pricing Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-white p-4 font-sans antialiased sm:p-8">
  <main class="w-full max-w-[720px] min-h-[520px] rounded-[32px] border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
    <header class="border-b border-slate-200 pb-5">
      <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold tracking-wide text-blue-600">EXERCISE 07</span>
      <h1 class="mt-5 text-[26px] font-extrabold tracking-tight text-slate-900">Pricing Card</h1>
      <p class="mt-2 text-sm text-slate-500">Feature list + pricing hierarchy + highlighted CTA</p>
    </header>

    <section class="mt-5 flex justify-center">
      <article class="w-full max-w-[400px] rounded-3xl border border-slate-200 bg-white p-6 transition hover:border-violet-200 hover:shadow-xl hover:shadow-violet-100">
        <span class="inline-flex rounded-full bg-violet-50 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wide text-violet-600">Most popular</span>

        <h2 class="mt-4 text-[22px] font-extrabold tracking-tight text-slate-900">Pro Plan</h2>

        <p class="mt-3 flex items-baseline gap-2">
          <span class="text-[40px] font-extrabold leading-none tracking-tight text-slate-900">$29</span>
          <span class="text-sm text-slate-500">/ month</span>
        </p>

        <ul class="mt-5 space-y-3 text-sm text-slate-700">
          <li class="flex items-center gap-1.5">
            <svg class="h-3.5 w-3.5 shrink-0 text-slate-700" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>
            Unlimited projects
          </li>
          <li class="flex items-center gap-1.5">
            <svg class="h-3.5 w-3.5 shrink-0 text-slate-700" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>
            Advanced analytics
          </li>
          <li class="flex items-center gap-1.5">
            <svg class="h-3.5 w-3.5 shrink-0 text-slate-700" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>
            Priority support
          </li>
        </ul>

        <button type="button"
          class="mt-5 inline-flex h-11 w-full items-center justify-center rounded-xl bg-violet-600 text-[15px] font-semibold text-white transition
                 hover:bg-violet-700 active:bg-violet-800
                 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 focus-visible:ring-offset-2">
          Start free trial
        </button>
      </article>
    </section>
  </main>
</body>
</html>
