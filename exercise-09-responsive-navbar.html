<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 09 — Responsive Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-white p-4 font-sans antialiased sm:p-8">
  <main class="w-full max-w-[720px] min-h-[520px] rounded-[32px] border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
    <header class="border-b border-slate-200 pb-5">
      <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold tracking-wide text-blue-600">EXERCISE 09</span>
      <h1 class="mt-5 text-[26px] font-extrabold tracking-tight text-slate-900">Responsive Navbar</h1>
      <p class="mt-2 text-sm text-slate-500">Logo + navigation + CTA + mobile-thinking</p>
    </header>

    <section class="mt-20">
      <nav class="relative rounded-3xl border border-slate-200 bg-white px-5" aria-label="Principal">
        <div class="flex h-[84px] items-center justify-between">
          <!-- Logo -->
          <a href="#" class="text-xl font-extrabold tracking-tight text-blue-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">TITLE</a>

          <!-- Links (desktop) -->
          <ul class="hidden items-center gap-6 text-sm md:flex">
            <li><a href="#" aria-current="page" class="font-medium text-slate-900">Home</a></li>
            <li><a href="#" class="text-slate-500 transition hover:text-slate-900">Products</a></li>
            <li><a href="#" class="text-slate-500 transition hover:text-slate-900">About</a></li>
            <li><a href="#" class="text-slate-500 transition hover:text-slate-900">Contact</a></li>
          </ul>

          <!-- CTA (desktop) -->
          <a href="#"
            class="hidden h-11 items-center justify-center rounded-xl bg-blue-600 px-6 text-[15px] font-semibold text-white transition hover:bg-blue-700
                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 md:inline-flex">
            Get started
          </a>

          <!-- Hamburger (mobile) -->
          <button id="menu-btn" type="button" aria-controls="mobile-menu" aria-expanded="false"
            class="inline-flex h-10 w-10 items-center justify-center rounded-xl text-slate-700 transition hover:bg-slate-100
                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 md:hidden">
            <span class="sr-only">Abrir menu</span>
            <svg id="icon-open" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <svg id="icon-close" class="hidden h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <!-- Menu mobile -->
        <div id="mobile-menu" class="hidden border-t border-slate-200 pb-5 pt-3 md:hidden">
          <ul class="flex flex-col gap-1 text-sm">
            <li><a href="#" aria-current="page" class="block rounded-lg bg-slate-50 px-3 py-2.5 font-medium text-slate-900">Home</a></li>
            <li><a href="#" class="block rounded-lg px-3 py-2.5 text-slate-500 transition hover:bg-slate-50 hover:text-slate-900">Products</a></li>
            <li><a href="#" class="block rounded-lg px-3 py-2.5 text-slate-500 transition hover:bg-slate-50 hover:text-slate-900">About</a></li>
            <li><a href="#" class="block rounded-lg px-3 py-2.5 text-slate-500 transition hover:bg-slate-50 hover:text-slate-900">Contact</a></li>
          </ul>
          <a href="#" class="mt-3 flex h-11 w-full items-center justify-center rounded-xl bg-blue-600 text-[15px] font-semibold text-white transition hover:bg-blue-700">
            Get started
          </a>
        </div>
      </nav>

      <p class="mt-12 text-center text-sm text-slate-500">Challenge: create desktop + mobile variants with Tailwind breakpoints.</p>
    </section>
  </main>

  <script>
    const btn = document.getElementById('menu-btn');
    const menu = document.getElementById('mobile-menu');
    btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      menu.classList.toggle('hidden', open);
      document.getElementById('icon-open').classList.toggle('hidden', !open);
      document.getElementById('icon-close').classList.toggle('hidden', open);
    });
  </script>
</body>
</html>
