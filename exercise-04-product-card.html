<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 04 — Product Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-white p-4 font-sans antialiased sm:p-8">
  <main class="w-full max-w-[720px] min-h-[520px] rounded-[32px] border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
    <header class="border-b border-slate-200 pb-5">
      <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold tracking-wide text-blue-600">EXERCISE 04</span>
      <h1 class="mt-5 text-[26px] font-extrabold tracking-tight text-slate-900">Product Card</h1>
      <p class="mt-2 text-sm text-slate-500">group-hover + content hierarchy + CTA</p>
    </header>

    <section class="mt-9 flex justify-center">
      <!-- "group" no card: hover em qualquer parte anima mídia, título e CTA -->
      <article class="group w-full max-w-[360px] overflow-hidden rounded-3xl border border-slate-200 bg-white transition duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-slate-200">
        <!-- Mídia -->
        <div class="flex h-32 items-center justify-center overflow-hidden bg-blue-600 transition-colors duration-300 group-hover:bg-blue-700">
          <span class="text-5xl font-extrabold tracking-tight text-white transition-transform duration-300 group-hover:scale-110">RUN</span>
        </div>

        <!-- Conteúdo -->
        <div class="px-6 pb-10 pt-5">
          <div class="flex items-center gap-1">
            <h2 class="text-lg font-bold text-slate-900 transition-colors group-hover:text-blue-600">Velocity Runner</h2>
            <span class="inline-flex rounded-full bg-green-50 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider text-green-600">New</span>
          </div>

          <p class="mt-3 text-sm text-slate-500">Lightweight everyday performance sneaker.</p>

          <div class="mt-4 flex items-center gap-5">
            <p class="text-2xl font-extrabold text-slate-900">R$ 499</p>
            <button type="button"
              class="inline-flex h-11 w-[100px] items-center justify-center rounded-xl bg-slate-900 text-sm font-medium text-white transition
                     group-hover:bg-blue-600 hover:!bg-blue-700
                     focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
              Buy
            </button>
          </div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
