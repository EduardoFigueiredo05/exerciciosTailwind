<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 06 — KPI Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-white p-4 font-sans antialiased sm:p-8">
  <main class="w-full max-w-[720px] min-h-[520px] rounded-[32px] border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
    <header class="border-b border-slate-200 pb-5">
      <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold tracking-wide text-blue-600">EXERCISE 06</span>
      <h1 class="mt-5 text-[26px] font-extrabold tracking-tight text-slate-900">KPI Card</h1>
      <p class="mt-2 text-sm text-slate-500">Data hierarchy + semantic status badge</p>
    </header>

    <section class="flex min-h-[340px] items-center justify-center">
      <article class="w-full max-w-[220px] rounded-3xl border border-slate-200 bg-white p-6 transition hover:shadow-lg hover:shadow-slate-200/70">
        <dl>
          <!-- Label + ícone -->
          <dt class="flex items-center justify-between text-sm font-medium text-slate-500">
            Revenue
            <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-blue-50 text-sm font-bold text-blue-600" aria-hidden="true">$</span>
          </dt>

          <!-- Valor principal -->
          <dd class="mt-6 text-[30px] font-extrabold leading-none tracking-tight text-slate-900">R$ 128.4k</dd>

          <!-- Variação -->
          <dd class="mt-5 flex items-center gap-2.5">
            <span class="inline-flex items-center rounded-full bg-green-50 px-2.5 py-1 text-xs font-bold text-green-600">
              <span class="sr-only">Aumento de </span>+12.8%
            </span>
            <span class="text-xs text-slate-500">vs previous period</span>
          </dd>
        </dl>
      </article>
    </section>
  </main>
</body>
</html>
