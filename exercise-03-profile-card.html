<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 03 — Profile Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-white p-4 font-sans antialiased sm:p-8">
  <main class="w-full max-w-[720px] min-h-[520px] rounded-[32px] border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
    <header class="border-b border-slate-200 pb-5">
      <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold tracking-wide text-blue-600">EXERCISE 03</span>
      <h1 class="mt-5 text-[26px] font-extrabold tracking-tight text-slate-900">Profile Card</h1>
      <p class="mt-2 text-sm text-slate-500">Composition: Avatar + Badge + Button</p>
    </header>

    <section class="mt-11 flex justify-center">
      <article class="w-full max-w-[402px] rounded-3xl border border-slate-200 bg-white p-6 transition hover:shadow-lg hover:shadow-slate-200/70">
        <!-- Avatar + identificação -->
        <div class="flex items-center gap-4">
          <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-blue-600 text-base font-bold text-white ring-2 ring-white" aria-hidden="true">EI</span>
          <div>
            <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider text-blue-600">Front-end</span>
            <h2 class="mt-1 text-[20px] font-bold tracking-tight text-slate-900">Eduardo Inocencio</h2>
            <p class="mt-0.5 text-sm text-slate-500">Professor · React · SPA</p>
          </div>
        </div>

        <p class="mt-5 text-sm text-slate-500">Building reusable interfaces with React and Tailwind CSS.</p>

        <!-- Ações -->
        <div class="mt-6 flex gap-2.5">
          <button id="follow-btn" type="button" aria-pressed="false"
            class="inline-flex h-11 flex-[1.4] items-center justify-center rounded-xl bg-blue-600 px-5 text-[15px] font-semibold text-white transition
                   hover:bg-blue-700 active:bg-blue-800
                   aria-pressed:bg-slate-900 aria-pressed:hover:bg-slate-800
                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
            Follow
          </button>
          <button type="button"
            class="inline-flex h-11 flex-1 items-center justify-center rounded-xl bg-slate-200 px-5 text-[15px] font-semibold text-slate-900 transition
                   hover:bg-slate-300
                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2">
            Profile
          </button>
        </div>
      </article>
    </section>
  </main>

  <script>
    const followBtn = document.getElementById('follow-btn');
    followBtn.addEventListener('click', () => {
      const pressed = followBtn.getAttribute('aria-pressed') === 'true';
      followBtn.setAttribute('aria-pressed', String(!pressed));
      followBtn.textContent = pressed ? 'Follow' : 'Following';
    });
  </script>
</body>
</html>
