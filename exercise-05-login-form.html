<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 05 — Login Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-white p-4 font-sans antialiased sm:p-8">
  <main class="w-full max-w-[720px] min-h-[520px] rounded-[32px] border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
    <header class="border-b border-slate-200 pb-5">
      <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold tracking-wide text-blue-600">EXERCISE 05</span>
      <h1 class="mt-5 text-[26px] font-extrabold tracking-tight text-slate-900">Login Form</h1>
      <p class="mt-2 text-sm text-slate-500">Input component + focus state + static form composition</p>
    </header>

    <section class="mt-3.5 flex justify-center">
      <form class="w-full max-w-[412px] rounded-3xl border border-slate-200 bg-white p-6 pb-5" onsubmit="event.preventDefault()">
        <h2 class="text-[26px] font-extrabold tracking-tight text-slate-900">Welcome back</h2>
        <p class="mt-3 text-sm text-slate-500">Sign in to continue</p>

        <!-- Email -->
        <label for="email" class="mt-3 block text-sm font-medium text-slate-700">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required
          class="mt-2 block h-[50px] w-full rounded-xl border border-slate-200 bg-white px-4 text-[15px] text-slate-900 placeholder:text-slate-500 transition
                 hover:border-slate-300
                 focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-100" />

        <!-- Password -->
        <label for="password" class="mt-4 block text-sm font-medium text-slate-700">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required
          class="mt-2 block h-[50px] w-full rounded-xl border border-slate-200 bg-white px-4 text-[15px] text-slate-900 placeholder:text-slate-500 transition
                 hover:border-slate-300
                 focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-100" />

        <!-- Remember / Forgot -->
        <div class="mt-4 flex items-center justify-between">
          <label class="flex cursor-pointer items-center gap-2 text-xs text-slate-500">
            <input type="checkbox" name="remember" class="h-3.5 w-3.5 rounded border-slate-300 accent-blue-600" />
            Remember me
          </label>
          <a href="#" class="rounded text-xs font-semibold text-blue-600 transition hover:text-blue-700 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="mt-5 inline-flex h-11 w-full items-center justify-center rounded-xl bg-blue-600 text-[15px] font-semibold text-white transition
                 hover:bg-blue-700 active:bg-blue-800
                 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
          Sign In
        </button>
      </form>
    </section>
  </main>
</body>
</html>
