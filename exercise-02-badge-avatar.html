<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 02 — Badge + Avatar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-white p-4 font-sans antialiased sm:p-8">
  <main class="w-full max-w-[720px] min-h-[520px] rounded-[32px] border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
    <header class="border-b border-slate-200 pb-5">
      <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold tracking-wide text-blue-600">EXERCISE 02</span>
      <h1 class="mt-5 text-[26px] font-extrabold tracking-tight text-slate-900">Badge + Avatar</h1>
      <p class="mt-2 text-sm text-slate-500">Small UI primitives with size, radius and semantic color</p>
    </header>

    <section class="mt-9 w-fit rounded-3xl bg-slate-100 p-6">
      <!-- Avatares 56×56 -->
      <div class="flex items-center gap-4">
        <span class="flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 text-base font-bold text-white ring-2 ring-white" title="EI">EI</span>
        <span class="flex h-14 w-14 items-center justify-center rounded-full bg-violet-600 text-base font-bold text-white ring-2 ring-white" title="UX">UX</span>
        <span class="flex h-14 w-14 items-center justify-center rounded-full bg-green-600 text-base font-bold text-white ring-2 ring-white" title="JS">JS</span>
      </div>

      <!-- Badges pill -->
      <div class="mt-5 flex flex-wrap items-center gap-2.5">
        <span class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider text-blue-600">Front-end</span>
        <span class="inline-flex rounded-full bg-green-50 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider text-green-600">New</span>
        <span class="inline-flex rounded-full bg-amber-50 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider text-amber-600">Warning</span>
      </div>

      <p class="mt-6 text-sm text-slate-500">Avatar: 56×56 · pill badge · uppercase tracking</p>
    </section>
  </main>
</body>
</html>
